<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senses Store - Rastreo de Pedido</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8a2be2;
            --primary-light: #f3e8ff;
            --secondary: #ec4899;
            --text-dark: #1f2937;
            --text-gray: #6b7280;
            --bg-light: #f9fafb;
            --success: #10b981;
            --pending: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .search-box {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .search-box button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background: #7522be;
        }

        .content {
            padding: 25px 20px;
        }

        .info-cliente {
            background: var(--primary-light);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-cliente span {
            font-weight: 600;
            color: var(--primary);
            font-size: 14px;
        }

        .timeline {
            position: relative;
            padding-left: 30px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 11px;
            top: 10px;
            bottom: 10px;
            width: 3px;
            background: var(--pending);
            border-radius: 2px;
        }

        .step {
            position: relative;
            margin-bottom: 25px;
            opacity: 0.5;
            transition: all 0.3s;
        }

        .step:last-child {
            margin-bottom: 0;
        }

        .step.completed, .step.active {
            opacity: 1;
        }

        .step-icon {
            position: absolute;
            left: -30px;
            top: 0;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: white;
            border: 3px solid var(--pending);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
            z-index: 1;
        }

        .step.completed .step-icon {
            background: var(--success);
            border-color: var(--success);
        }

        .step.active .step-icon {
            background: var(--primary);
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .step-content {
            padding-left: 10px;
        }

        .step-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 2px;
        }

        .step.active .step-title {
            color: var(--primary);
            font-size: 15px;
        }

        .step-time {
            font-size: 12px;
            color: var(--text-gray);
        }

        .error-msg {
            color: #ef4444;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>SENSES STORE</h1>
            <p>Rastreo de Envíos</p>
        </div>

        <div class="search-box">
            <input type="text" id="trackingInput" placeholder="Ingresa tu N° de Guía (ej. SNS-2026)">
            <button onclick="buscarPedido()">Buscar</button>
        </div>

        <div id="errorMsg" class="error-msg">
            No encontramos ese número de guía. Por favor verifica e intenta de nuevo.
        </div>

        <div class="content" id="trackingResult" style="display: none;">
            <div class="info-cliente">
                <span id="clienteNombre">Cliente: ---</span>
                <span id="guiaCodigo" style="color: var(--text-gray);">Guía: ---</span>
            </div>

            <div class="timeline" id="timelineSteps">
                <!-- Los pasos se generan dinámicamente -->
            </div>
        </div>
    </div>

    <script>
        // =========================================================
        // TU AGENDA DE PEDIDOS (AQUÍ ES DONDE EDITAS CADA CHICA)
        // =========================================================
        const pedidos = {

            // --- CHICA 1 ---
            "SNS-2026": {
                cliente: "Cliente: Sofía Gómez",
                pasoActual: 7, // En qué número de paso va hoy (del 0 al 11)
                fechas: {
                    0: "18 Jul - 10:50 AM",
                    1: "18 Jul - 03:00 PM",
                    2: "19 Jul - 09:00 AM",
                    3: "19 Jul - 02:15 PM",
                    4: "20 Jul - 08:30 AM",
                    5: "21 Jul - 11:00 AM",
                    6: "21 Jul - 04:30 PM",
                    7: "22 Jul - 06:00 PM"
                }
            },

            // --- CHICA 2 (Ejemplo para cuando agregues otra) ---
            "SNS-2027": {
                cliente: "Cliente: María Pérez",
                pasoActual: 1,
                fechas: {
                    0: "25 Jul - 02:30 PM",
                    1: "26 Jul - 09:00 AM"
                }
            }

        };

        // LISTA MAESTRA DE PASOS DEL PAQUETE
        const listaPasos = [
            "📦 Pedido confirmado",
            "📦 Preparando pedido",
            "📦 Empacado",
            "🚚 Recogido por transportadora",
            "✈️ Salió de origen",
            "✈️ Llegó al aeropuerto",
            "🛃 En proceso de aduana",
            "🇨🇴 Llegó a Colombia",
            "🚚 Llegó a Medellín",
            "🚚 En camino a Senses Store",
            "🏠 Recibido en Senses Store",
            "📦 Entregado a MRW Venezuela"
        ];

        function buscarPedido() {
            const input = document.getElementById("trackingInput").value.trim().toUpperCase();
            const resultDiv = document.getElementById("trackingResult");
            const errorDiv = document.getElementById("errorMsg");
            const timeline = document.getElementById("timelineSteps");

            if (!pedidos[input]) {
                resultDiv.style.display = "none";
                errorDiv.style.display = "block";
                return;
            }

            errorDiv.style.display = "none";
            resultDiv.style.display = "block";

            const pedido = pedidos[input];
            document.getElementById("clienteNombre").innerText = pedido.cliente;
            document.getElementById("guiaCodigo").innerText = `Guía: ${input}`;

            timeline.innerHTML = "";

            listaPasos.forEach((pasoNombre, index) => {
                const stepDiv = document.createElement("div");
                stepDiv.className = "step";

                // Determinar estado del paso
                if (index < pedido.pasoActual) {
                    stepDiv.classList.add("completed");
                } else if (index === pedido.pasoActual) {
                    stepDiv.classList.add("active");
                }

                // Obtener fecha si existe en las fechas asignadas
                let fechaTexto = "Pendiente";
                if (pedido.fechas && pedido.fechas[index]) {
                    fechaTexto = pedido.fechas[index];
                }

                stepDiv.innerHTML = `
                    <div class="step-icon">${index < pedido.pasoActual ? '✓' : ''}</div>
                    <div class="step-content">
                        <div class="step-title">${pasoNombre}</div>
                        <div class="step-time">${fechaTexto}</div>
                    </div>
                `;

                timeline.appendChild(stepDiv);
            });
        }
    </script>
</body>
    </html>
